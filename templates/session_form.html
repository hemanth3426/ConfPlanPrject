{% extends "base.html" %}{% block title %}Add session | ConfPlan{% endblock %}
{% block content %}<div class="form-page"><form class="form-card wide" method="post"><span class="eyebrow">ADMIN · SESSION SETUP</span><h1>Add a session</h1><p>For: {{ conference.title }}</p><label>Session title</label><input name="title" required><label>Speaker name</label><input name="speaker" required><label>Description</label><textarea name="description" rows="3"></textarea><label>Room</label><select name="room_id" required>{% for r in rooms %}<option value="{{ r.id }}">{{ r.name }} · {{ r.location }} · capacity {{ r.capacity }}</option>{% endfor %}</select><div class="two-col"><div><label>Start time</label><input type="time" name="start_time" required></div><div><label>End time</label><input type="time" name="end_time" required></div></div><label>Session capacity</label><input type="number" name="capacity" min="1" value="40" required><button class="btn primary">Save session</button></form></div>{% endblock %}
