{% extends "base.html" %}{% block title %}Rooms | ConfPlan{% endblock %}
{% block content %}<div class="page-heading"><div><span class="eyebrow">ADMIN · VENUE MANAGEMENT</span><h1>Conference rooms</h1><p>Manage rooms and their seating capacity.</p></div></div><div class="split-layout"><form class="form-card" method="post"><h2>Add room</h2><label>Room name</label><input name="name" required><label>Location</label><input name="location" required><label>Capacity</label><input type="number" name="capacity" min="1" required><button class="btn primary full">Add room</button></form><div class="room-list">{% for r in rooms %}<div class="room-row"><div class="event-icon">⌂</div><div><strong>{{ r.name }}</strong><p>{{ r.location }}</p></div><span class="capacity">{{ r.capacity }} seats</span></div>{% endfor %}</div></div>{% endblock %}
