{% extends "base.html" %}{% block title %}Sign up | ConfPlan{% endblock %}
{% block content %}<div class="auth-wrap"><form class="form-card" method="post"><span class="eyebrow">JOIN THE EVENT</span><h1>Create attendee account</h1><p>Register for sessions and get your personal route.</p><label>Full name</label><input name="name" required placeholder="Your name"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"><button class="btn primary full">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></div>{% endblock %}
